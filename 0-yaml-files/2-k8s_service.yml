apiVersion: v1
kind: Service
metadata:
  name: service-for-myownpod
spec:
  # serviceName: "service"
  selector:
    app: nginxapp
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
  type: NodePort #LoadBalancer cluster



